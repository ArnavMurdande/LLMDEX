name: LLMDEX CI

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "data/**"
      - "**.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: .

      - name: Lint Python for runtime errors
        run: ruff check --select E9,F63,F7,F82 api_server.py pipeline scraper scripts utils tests

      - name: Compile Python sources
        run: python -m compileall -q api_server.py pipeline scraper scripts utils

      - name: Check frontend JavaScript
        run: node --check website/app.js

      - name: Validate versioned methodology contracts
        run: |
          python -m json.tool data/methodology/source_config.json >/dev/null
          python -m json.tool data/methodology/benchmark_registry.json >/dev/null
          python -m json.tool data/methodology/score_versions.json >/dev/null
