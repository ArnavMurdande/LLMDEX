name: Deploy GitHub Pages

on:
  workflow_run:
    workflows:
      - Daily LLM Benchmark Update + Deploy
      - Dependency Maintenance
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Build Pages artifact
        run: |
          mkdir -p _site/data/cleaned
          cp -r website/. _site/
          sed -i 's|\.\./data/|./data/|g' _site/app.js _site/index.html
          cp -r data/index _site/data/index
          cp -r data/families _site/data/families
          cp -r data/capabilities _site/data/capabilities
          cp -r data/quality _site/data/quality
          cp -r data/identity _site/data/identity
          cp -r data/methodology _site/data/methodology
          cp -r data/cleaned/llmstats _site/data/cleaned/llmstats
          cp -r data/history _site/data/history
          cp -r data/sentiment _site/data/sentiment
          cp data/models.json data/column_definitions.json _site/data/
          cp -r docs _site/docs
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
