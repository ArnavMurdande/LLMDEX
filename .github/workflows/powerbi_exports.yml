name: Generate Power BI Exports

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/powerbi_exports.yml"
      - "data/cleaned/**"
      - "data/capabilities/**"
      - "data/families/**"
      - "data/history/**"
      - "data/index/**"
      - "data/identity/**"
      - "data/methodology/provider_metadata_registry.json"
      - "pipeline/export_powerbi.py"
      - "pipeline/provider_metadata.py"
      - "tests/test_powerbi_exports.py"
  workflow_dispatch:

concurrency:
  # Serialize with the daily publisher because both workflows write to main.
  group: llmdex-multisource-update
  cancel-in-progress: false

jobs:
  export-powerbi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate Power BI Exports
        run: python -m pipeline.export_powerbi --include-git-history
        env:
          PYTHONPATH: .

      - name: Run Power BI Export Unit Tests
        run: python -m unittest tests/test_powerbi_exports.py -v
        env:
          PYTHONPATH: .

      - name: Commit and Push Power BI Exports
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/powerbi/v1/ website/assets/providers/

          if git diff --cached --quiet; then
            echo "No changes in Power BI exports to commit."
            exit 0
          fi

          git commit -m "Update Power BI exports [skip ci]"

          # A human push can still land after the shared workflow lock starts.
          # Rebase and retry instead of rejecting the generated publication.
          for attempt in 1 2 3; do
            git fetch origin main
            git stash --include-untracked || true
            if git rebase -X theirs origin/main; then
              git stash pop || true
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
              git stash pop || true
            fi
            echo "Push race detected; retrying (${attempt}/3)."
          done

          echo "Unable to publish Power BI exports after three attempts."
          exit 1
