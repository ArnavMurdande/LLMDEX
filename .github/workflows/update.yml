name: Daily LLM Benchmark Update

on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/**"
      - "**.md"
  schedule:
    # 4:00 PM IST = 10:30 AM UTC
    - cron: "30 10 * * *"
  workflow_dispatch: # Manual trigger

concurrency:
  group: llmdex-multisource-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: .

      - name: Lint Python for runtime errors
        run: ruff check --select E9,F63,F7,F82 api_server.py pipeline scraper scripts utils tests

      # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      # Run the main scraper + merge pipeline
      # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Run Scraper and Top-10 Sentiment Pipeline
        id: pipeline
        run: python pipeline/run_pipeline.py --with-sentiment
        env:
          PYTHONPATH: .
          GEMINI_SENTIMENT_KEY_1: ${{ secrets.GEMINI_SENTIMENT_KEY_1 }}
          GEMINI_SENTIMENT_KEY_2: ${{ secrets.GEMINI_SENTIMENT_KEY_2 }}
          GEMINI_SENTIMENT_KEY_3: ${{ secrets.GEMINI_SENTIMENT_KEY_3 }}
          GEMINI_SENTIMENT_KEY_4: ${{ secrets.GEMINI_SENTIMENT_KEY_4 }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}

      # â”€â”€ Build family history data â”€â”€
      - name: Build Family History
        if: success()
        run: python pipeline/build_family_history.py
        env:
          PYTHONPATH: .

      - name: Generate Power BI Exports
        if: success()
        run: python -m pipeline.export_powerbi --include-git-history
        env:
          PYTHONPATH: .

      - name: Validate publication contract
        if: success()
        run: python pipeline/validate_publication.py
        env:
          PYTHONPATH: .

      # â”€â”€ Upload pipeline report as CI artifact â”€â”€
      - name: Upload Pipeline Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-report-${{ github.run_number }}
          path: data/pipeline_reports/
          retention-days: 90

      # â”€â”€ Upload archived datasets as CI artifact â”€â”€
      - name: Upload Dataset Archives
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: dataset-archive-${{ github.run_number }}
          path: |
            data/raw_snapshot/archive/
            data/cleaned/archive/
            data/index/archive/
            data/raw/artificial_analysis/
            data/raw/llmstats/
          retention-days: 365

      # â”€â”€ Commit data files back to main branch â”€â”€
      - name: Commit and Push Data
        if: success()
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          # Add all latest data files (these power the website)
          git add data/models.json data/models.csv || true
          git add data/index/latest.json data/index/latest.csv || true
          git add data/families/latest.json || true
          git add data/capabilities/ || true
          git add data/identity/ || true
          git add data/quality/ || true
          git add data/methodology/ || true
          git add data/cleaned/latest.json data/cleaned/latest.csv || true
          git add data/cleaned/artificial_analysis/ data/cleaned/llmstats/ || true
          git add data/raw_snapshot/latest.json data/raw_snapshot/latest.csv || true
          git add data/history/family_growth.json || true
          git add data/history/release_dates.json || true
          git add data/history/*.json data/history/*.csv || true
          git add data/sentiment/latest.json || true
          git add data/powerbi/v1/ || true

          if git diff --cached --quiet; then
            echo "No publication changes to commit."
            exit 0
          fi

          git commit -m "Update benchmark data $(date -u +%Y-%m-%d) [skip ci]"

          # Rebase safely by stashing any remaining untracked artifacts
          for attempt in 1 2 3; do
            git fetch origin main
            git stash --include-untracked || true
            if git rebase -X theirs origin/main; then
              git stash pop || true
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
              git stash pop || true
            fi
            echo "Push race detected; retrying (${attempt}/3)."
          done

          echo "Unable to publish generated data after three attempts."
          exit 1

      # â”€â”€ On failure: upload report for debugging â”€â”€
      - name: Upload Failure Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-report-${{ github.run_number }}
          path: data/pipeline_reports/
          retention-days: 30

      - name: Report recurring update failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="[Automation] Daily LLMDEX update failed"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          issue_number="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "The scheduled update failed again: ${run_url}"
          else
            gh issue create --title "$title" --body "The scraper, sentiment, or publication contract failed. Inspect the workflow artifact and logs: ${run_url}"
          fi

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Render and Cloudflare Pages deploy from main through their Git integrations.
  # GitHub Pages runs separately after this workflow succeeds, so a Pages queue
  # cannot delay or fail the benchmark publication job.
  # The daily workflow ends immediately after publishing validated data.
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
